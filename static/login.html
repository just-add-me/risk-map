<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — WarRisk Monitor</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
  <form class="login-card" method="post" action="/login">
    <div class="brand big"><span class="brand-mark"></span>WarRisk<span class="brand-dim">Monitor</span></div>
    <p class="muted">Мониторинг флота в зонах JWC Listed Areas</p>
    <label>Логин<input name="username" autocomplete="username" required autofocus></label>
    <label>Пароль<input name="password" type="password" autocomplete="current-password" required></label>
    <div class="login-error">{{error}}</div>
    <button class="btn" type="submit">Войти</button>
  </form>
</body>
</html>
