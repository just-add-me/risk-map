<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — FleetRisk</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script>/* тема до отрисовки страницы: выбранная пользователем, иначе как в системе */
(function () { var t = null; try { t = localStorage.getItem("theme"); } catch (e) {}
  if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  document.documentElement.dataset.theme = t; })();</script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
  <form class="login-card" method="post" action="/login">
    <div class="brand big"><span class="brand-mark"></span>FleetRisk</div>
    <p class="muted">Мониторинг флота в зонах JWC Listed Areas</p>
    <label>Логин<input name="username" autocomplete="username" required autofocus></label>
    <label>Пароль<input name="password" type="password" autocomplete="current-password" required></label>
    <div class="login-error">{{error}}</div>
    <button class="btn" type="submit">Войти</button>
  </form>
</body>
</html>
